name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repository'yi Kopyala
      uses: actions/checkout@v3

    - name: Node.js Ortamını Kur
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Java (JDK 17) Ortamını Kur
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Bağımlılıkları Yükle ve Capacitor Başlat
      run: |
        npm install
        npx cap init TriagePulse com.triagepulse.ultra --web-dir . --yes
        npx cap add android

    - name: Android Projesini Derle (Debug APK)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Üretilen APK Dosyasını Kaydet (Artifacts)
      uses: actions/upload-artifact@v3
      with:
        name: TriagePulse-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
