<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TriagePulse Ultra - Akıllı Acil Karar Destek</title>
<style>
:root {
--bg-deep: #070913;
--surface: #0f172a;
--surface-hover: #1e293b;
--border: #1e293b;
--text-main: #f8fafc;
--text-muted: #94a3b8;
--accent: #3b82f6;
--accent-hover: #2563eb;

--red: #ef4444;
--yellow: #f59e0b;
--green: #10b981;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
background: linear-gradient(135deg, var(--bg-deep) 0%, #020617 100%);
color: var(--text-main);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 16px;
}

.app-container {
width: 100%;
max-width: 600px;
background-color: var(--surface);
border: 1px solid var(--border);
border-radius: 24px;
padding: 24px;
box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
animation: fadeIn 0.4s ease-out;
}

header {
text-align: center;
margin-bottom: 24px;
}

header h1 {
font-size: 1.6rem;
font-weight: 800;
color: #fff;
letter-spacing: -0.5px;
margin-bottom: 4px;
}

header p {
font-size: 0.78rem;
color: var(--text-muted);
text-transform: uppercase;
letter-spacing: 1.5px;
}

.section-box {
background-color: rgba(15, 23, 42, 0.6);
border: 1px solid var(--border);
border-radius: 16px;
padding: 16px;
margin-bottom: 14px;
transition: border-color 0.2s;
}

.section-box:hover {
border-color: rgba(59, 130, 246, 0.3);
}

.box-title {
font-size: 0.75rem;
font-weight: 700;
color: #38bdf8;
text-transform: uppercase;
letter-spacing: 1px;
margin-bottom: 10px;
display: flex;
align-items: center;
gap: 6px;
}

.form-group {
margin-bottom: 10px;
}

.form-group:last-child {
margin-bottom: 0;
}

label {
display: block;
font-size: 0.82rem;
font-weight: 600;
color: var(--text-muted);
margin-bottom: 5px;
}

select, input {
width: 100%;
padding: 11px 14px;
background-color: #020617;
border: 1px solid var(--border);
border-radius: 10px;
color: #fff;
font-size: 0.95rem;
transition: all 0.2s ease;
}

select:focus, input:focus {
outline: none;
border-color: var(--accent);
box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
}

.grid-2 {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
}

.grid-3 {
display: grid;
grid-template-columns: 1fr 1fr 1fr;
gap: 8px;
}

.btn-action {
width: 100%;
padding: 16px;
background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
color: white;
border: none;
border-radius: 14px;
font-size: 1rem;
font-weight: 700;
cursor: pointer;
box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35);
margin-top: 8px;
transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.btn-action:hover {
transform: translateY(-2px);
box-shadow: 0 12px 24px rgba(59, 130, 246, 0.5);
}

.btn-action:active {
transform: translateY(0);
}

/* MODAL EKRANI STİLLERİ */
#resultModal {
position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
background-color: rgba(2, 6, 23, 0.85);
backdrop-filter: blur(8px);
display: none;
justify-content: center;
align-items: center;
z-index: 9999;
padding: 16px;
animation: fadeIn 0.2s ease;
}

.modal-content {
width: 100%;
max-width: 480px;
border-radius: 24px;
padding: 28px;
border: 2px solid;
box-sizing: border-box;
text-align: left;
animation: scaleUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.theme-red {
background: linear-gradient(145deg, #1f0b0e 0%, #0f0305 100%);
border-color: var(--red);
color: #fca5a5;
box-shadow: 0 0 50px rgba(239, 68, 68, 0.25);
}

.theme-yellow {
background: linear-gradient(145deg, #1f180a 0%, #0f0b03 100%);
border-color: var(--yellow);
color: #fde68a;
box-shadow: 0 0 50px rgba(245, 158, 11, 0.25);
}

.theme-green {
background: linear-gradient(145deg, #091c14 0%, #030d08 100%);
border-color: var(--green);
color: #a7f3d0;
box-shadow: 0 0 50px rgba(16, 185, 129, 0.25);
}

.modal-badge {
display: inline-block;
font-size: 0.75rem;
font-weight: 800;
text-transform: uppercase;
padding: 6px 14px;
border-radius: 20px;
margin-bottom: 12px;
letter-spacing: 1px;
}
.theme-red .modal-badge { background-color: var(--red); color: #fff; }
.theme-yellow .modal-badge { background-color: var(--yellow); color: #000; }
.theme-green .modal-badge { background-color: var(--green); color: #fff; }

.modal-title {
font-size: 1.45rem;
font-weight: 900;
margin-bottom: 8px;
color: #fff;
letter-spacing: -0.5px;
}

.modal-desc {
font-size: 0.95rem;
line-height: 1.5;
margin-bottom: 18px;
color: #f1f5f9;
}

.triggers-list {
list-style: none;
margin-bottom: 22px;
background: rgba(0, 0, 0, 0.3);
padding: 14px;
border-radius: 12px;
border: 1px solid rgba(255, 255, 255, 0.05);
}

.triggers-list li {
font-size: 0.85rem;
margin-bottom: 6px;
color: #e2e8f0;
}
.triggers-list li:last-child {
margin-bottom: 0;
}

.btn-close {
width: 100%;
padding: 14px;
background: rgba(255, 255, 255, 0.12);
color: white;
border: 1px solid rgba(255, 255, 255, 0.2);
border-radius: 12px;
font-size: 0.95rem;
font-weight: 700;
cursor: pointer;
transition: background 0.2s;
}

.btn-close:hover {
background: rgba(255, 255, 255, 0.22);
}

@keyframes fadeIn {
from { opacity: 0; }
to { opacity: 1; }
}

@keyframes scaleUp {
from { transform: scale(0.85); opacity: 0; }
to { transform: scale(1); opacity: 1; }
}
</style>
</head>
<body>

<div class="app-container">
<header>
<h1>TriagePulse Ultra</h1>
<p>Gelişmiş Acil Klinik Karar Destek</p>
</header>

<!-- 1. BİLİNÇ & NÖROLOJİ -->
<div class="section-box">
<div class="box-title">⚡ 1. Bilinç & Nöroloji</div>
<div class="form-group">
<label for="avpu">Bilinç Durumu (AVPU)</label>
<select id="avpu">
<option value="A">Alert (Tamamen Bilinçli, Oryante)</option>
<option value="C">Konfüze / Ajite (Bilinç Bulanık)</option>
<option value="V">Verbal (Sözel Uyaranla Yanıt)</option>
<option value="P">Pain (Ağrılı Uyaranla Yanıt)</option>
<option value="U">Unresponsive (Koma / Yanıtsız)</option>
</select>
</div>
<div class="form-group" style="margin-top: 10px;">
<label for="neuro">Akut Nörolojik Tablo</label>
<select id="neuro">
<option value="none">Yok</option>
<option value="stroke">Akut İnme Şüphesi (Güç Kaybı / Peltek Konuşma)</option>
<option value="seizure">Aktif Konvülsiyon / Nöbet (Status Epilepticus)</option>
<option value="post_ictal">Post-iktal Dönem (Nöbet Sonrası Uykuya Eğilim)</option>
</select>
</div>
</div>

<!-- 2. VİTAL BULGULAR -->
<div class="section-box">
<div class="box-title">❤️ 2. Vital Bulgular</div>
<div class="grid-2">
<div class="form-group">
<label for="sbp">Sistolik TA (mmHg)</label>
<input type="number" id="sbp" value="120">
</div>
<div class="form-group">
<label for="dbp">Diyastolik TA (mmHg)</label>
<input type="number" id="dbp" value="80">
</div>
</div>
<div class="grid-3" style="margin-top: 10px;">
<div class="form-group">
<label for="hr">Nabız (/dk)</label>
<input type="number" id="hr" value="80">
</div>
<div class="form-group">
<label for="rr">Solunum (/dk)</label>
<input type="number" id="rr" value="16">
</div>
<div class="form-group">
<label for="spo2">SpO2 (%)</label>
<input type="number" id="spo2" value="98">
</div>
</div>
<div class="grid-2" style="margin-top: 10px;">
<div class="form-group">
<label for="temp">Vücut Sıcaklığı (°C)</label>
<input type="number" step="0.1" id="temp" value="36.8">
</div>
<div class="form-group">
<label for="pain">Ağrı Skalası (VAS 0-10)</label>
<select id="pain">
<option value="0">0 - Ağrı Yok</option>
<option value="3">3 - Hafif Ağrı</option>
<option value="6">6 - Orta Şiddetli Ağrı</option>
<option value="8">8 - Şiddetli Ağrı</option>
<option value="10">10 - Dayanılmaz / Ezici Ağrı</option>
</select>
</div>
</div>
</div>

<!-- 3. ANA BAŞVURU ŞİKAYETİ -->
<div class="section-box">
<div class="box-title">🩺 3. Başvuru Şikayeti & Semptom</div>
<div class="form-group">
<label for="symptom">Kritik Tablolar</label>
<select id="symptom">
<option value="none">Özel Kritik Semptom Yok</option>
<option value="chest_pain">Göğüs Ağrısı / Akut Koroner Sendrom Şüphesi</option>
<option value="dyspnea">Ağır Solunum Sıkıntısı / Hava Açlığı / Siyanoz</option>
<option value="major_trauma">Majör Travma / Açık Kırık / Kafa Travması</option>
<option value="acute_abdomen">Akut Batın / Şiddetli Yaygın Karın Ağrısı</option>
<option value="anaphylaxis">Anafilaksi / Dil-Dudak Ödemi / Stridor</option>
<option value="poisoning">Akut Zehirlenme / Aşırı İlaç Alımı</option>
<option value="severe_bleeding">Aktif Masif Sindirim Sistemi / Dış Kanama</option>
</select>
</div>
</div>

<button type="button" class="btn-action" onclick="evaluateTriage()">Triyaj Kodunu Hesapla</button>
</div>

<!-- MODAL EKRANI -->
<div id="resultModal">
<div class="modal-content" id="modalCard">
<div class="modal-badge" id="modalBadge">KOD</div>
<div class="modal-title" id="modalTitle">Başlık</div>
<div class="modal-desc" id="modalDesc">Açıklama</div>
<ul class="triggers-list" id="modalTriggers"></ul>
<button type="button" class="btn-close" onclick="closeModal()">Kapat ve Sıfırla</button>
</div>
</div>

<script>
function evaluateTriage() {
const avpu = document.getElementById('avpu').value;
const neuro = document.getElementById('neuro').value;
const sbp = parseInt(document.getElementById('sbp').value) || 120;
const dbp = parseInt(document.getElementById('dbp').value) || 80;
const hr = parseInt(document.getElementById('hr').value) || 80;
const rr = parseInt(document.getElementById('rr').value) || 16;
const spo2 = parseInt(document.getElementById('spo2').value) || 98;
const temp = parseFloat(document.getElementById('temp').value) || 36.8;
const pain = parseInt(document.getElementById('pain').value) || 0;
const symptom = document.getElementById('symptom').value;

let triggers = [];
let status = 'green';
let title = 'YEŞİL KOD (Poliklinik / Ayaktan)';
let desc = 'Hayati tehlike bulgusu saptanmadı. Vital bulgular ve bilinç stabil. Yeşil alanda izlenebilir.';

let isRed = false;

if (avpu === 'P' || avpu === 'U') {
isRed = true;
triggers.push('Kritik Bilinç Kaybı / Yanıtsızlık (AVPU: ' + avpu + ')');
}
if (neuro === 'seizure') {
isRed = true;
triggers.push('Aktif Status Epilepticus / Konvülsiyon');
}
if (temp >= 39.5 && (avpu === 'C' || avpu === 'V')) {
isRed = true;
triggers.push('Yüksek Ateş (' + temp + '°C) + Bilinç Bulanıklığı (Sepsis/Menenjit Şüphesi)');
}
if (sbp < 90) {
isRed = true;
triggers.push('Hipotansiyon / Şok Bulgusu (Sistolik TA: ' + sbp + ' mmHg)');
}
if (hr > 130 || hr < 40) {
isRed = true;
triggers.push('Kritik Nabız Anormalliği (' + hr + '/dk)');
}
if (rr > 30 || rr < 10) {
isRed = true;
triggers.push('Kritik Solunum Sayısı (' + rr + '/dk)');
}
if (spo2 < 90) {
isRed = true;
triggers.push('Şiddetli Hipoksi (SpO2: %' + spo2 + ')');
}
if (symptom === 'anaphylaxis' || symptom === 'poisoning') {
isRed = true;
triggers.push('Anafilaksi veya Akut Toksik Zehirlenme Tablosu');
}
if (symptom === 'major_trauma' && (sbp < 100 || hr > 120)) {
isRed = true;
triggers.push('Hemodinamik Bozulma Gösteren Majör Travma / Masif Kanama');
}

if (isRed) {
status = 'red';
title = 'KIRMIZI KOD (Resüsitasyon Alanı)';
desc = 'ACİL RESÜSİTASYON GEREKTİRİR! Hayatı tehdit eden çoklu organ riski veya şok tablosu mevcut. Bekletilmeden 1 Nolu Resüsitasyon Odasına alınmalıdır.';
} else {
let isYellow = false;

if (avpu === 'C' || avpu === 'V') {
isYellow = true;
triggers.push('Bilinç Bulanıklığı / Konfüzyon');
}
if (neuro === 'stroke' || neuro === 'post_ictal') {
isYellow = true;
triggers.push('Akut İnme Şüphesi veya Post-iktal Dönem');
}
if ((sbp >= 90 && sbp <= 100) || sbp >= 180 || dbp >= 110) {
isYellow = true;
triggers.push('Kritik Kan Basıncı Sınırları (TA: ' + sbp + '/' + dbp + ' mmHg)');
}
if ((hr >= 110 && hr <= 130) || (hr >= 40 && hr <= 50)) {
isYellow = true;
triggers.push('Sınır Değerlerde Nabız Atımı (' + hr + '/dk)');
}
if ((rr >= 22 && rr <= 30) || (spo2 >= 90 && spo2 <= 93)) {
isYellow = true;
triggers.push('Solunum Sıkıntısı / Sınırda SpO2 (SpO2: %' + spo2 + ', RR: ' + rr + ')');
}
if (temp >= 39.0 || temp <= 35.0) {
isYellow = true;
triggers.push('Kritik Vücut Sıcaklığı (' + temp + '°C)');
}
if (pain >= 8) {
isYellow = true;
triggers.push('Şiddetli / Dayanılmaz Ağrı (VAS: ' + pain + '/10)');
}
if (symptom !== 'none') {
isYellow = true;
triggers.push('Yüksek Riskli Acil Başvuru Semptomu');
}

if (isYellow) {
status = 'yellow';
title = 'SARI KOD (Acil Gözlem Alanı)';
desc = 'ACİL GÖZLEM GEREKTİRİR! Yüksek riskli klinik bulgular saptandı. Tetkik, EKG ve yakın takip için Sarı Alana yönlendirilmelidir.';
}
}

const modal = document.getElementById('resultModal');
const card = document.getElementById('modalCard');
const badge = document.getElementById('modalBadge');
const titleEl = document.getElementById('modalTitle');
const descEl = document.getElementById('modalDesc');
const listEl = document.getElementById('modalTriggers');

card.className = 'modal-content theme-' + status;
badge.innerText = status === 'red' ? 'ACİL / KRİTİK' : (status === 'yellow' ? 'ACİL GÖZLEM' : 'POLİKLİNİK');
titleEl.innerText = title;
descEl.innerText = desc;

listEl.innerHTML = '';
if (triggers.length > 0) {
triggers.forEach(function(t) {
let li = document.createElement('li');
li.innerText = '• ' + t;
listEl.appendChild(li);
});
} else {
let li = document.createElement('li');
li.innerText = '• Hayati tehlike oluşturan bulgu saptanmadı.';
listEl.appendChild(li);
}

modal.style.display = 'flex';
}

function closeModal() {
document.getElementById('resultModal').style.display = 'none';
}
</script>

</body>
</html>
